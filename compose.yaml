services:
  web:
    image: ${DOCKERHUB_NAMESPACE:-giam17}/giam-tejerina-portafolio-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORTFOLIO_BIND_ADDRESS:-127.0.0.1}:${PORTFOLIO_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 15s
      timeout: 4s
      retries: 6
    restart: unless-stopped

  api:
    image: ${DOCKERHUB_NAMESPACE:-giam17}/giam-tejerina-portafolio-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configura DATABASE_URL en el .env local del servidor}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      DATABASE_CA_FILE: /app/certs/supabase-ca.crt
      STATS_ADMIN_PASSWORD: ${STATS_ADMIN_PASSWORD:?Configura STATS_ADMIN_PASSWORD en el .env local del servidor}
      API_TRUST_PROXY: 'true'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 6
    restart: unless-stopped
