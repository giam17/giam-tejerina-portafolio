name: CI del portafolio en dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  unitarias:
    name: 3 pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  integracion:
    name: 3 pruebas de integración
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_PASSWORD: portfolio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:portfolio_test@127.0.0.1:5432/portfolio_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    name: 3 pruebas de extremo a extremo
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_PASSWORD: portfolio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:portfolio_test@127.0.0.1:5432/portfolio_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compilar el backend TypeScript
        run: npm run build:api
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Publicar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-e2e
          path: playwright-report/
          if-no-files-found: ignore
