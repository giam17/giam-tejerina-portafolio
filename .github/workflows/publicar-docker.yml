name: Publicar el portafolio en Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    name: Publicar imagen de ${{ matrix.component }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            dockerfile: Dockerfile
          - component: api
            dockerfile: Dockerfile.api
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Entrar a Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/giam-tejerina-portafolio-${{ matrix.component }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Registrar el digest publicado
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: printf 'Imagen %s\n\nDigest `%s`\n' "$COMPONENT" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
